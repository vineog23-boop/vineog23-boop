<svg xmlns="http://www.w3.org/2000/svg" width="854" height="280" viewBox="0 0 854 280" role="img" aria-labelledby="title desc">
<title id="title">Vinícius Oliveira — Backend Java</title>
<desc id="desc">Cabeçalho animado: Java e Spring Boot, APIs, segurança e testes, e microsserviços em estudo.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F3F8FB"/><stop offset="1" stop-color="#DCECEB"/></linearGradient>
<linearGradient id="line"><stop stop-color="#087F79" stop-opacity="0"/><stop offset=".45" stop-color="#087F79"/><stop offset="1" stop-color="#3672CA" stop-opacity=".1"/></linearGradient>
<clipPath id="frame"><rect width="854" height="280" rx="20"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.name{font-size:70px;font-weight:700;letter-spacing:-2px;fill:#13283B}
.label{font-size:19px;letter-spacing:5px;fill:#345568}
.message{font-size:34px;font-weight:500;fill:#087F79;opacity:0;animation:message 12s infinite}
.second{animation-delay:4s}.third{animation-delay:8s}
.flow{stroke-dasharray:80 700;animation:flow 10s linear infinite}
.wave{transform-origin:center;animation:drift 9s ease-in-out infinite alternate}
@keyframes message{0%{opacity:0;transform:translateY(8px)}4%,28%{opacity:1;transform:translateY(0)}32%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes flow{to{stroke-dashoffset:-780}}
@keyframes drift{to{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.message,.flow,.wave{animation:none}.first{opacity:1}.second,.third{display:none}}
</style>
<g clip-path="url(#frame)">
<rect width="854" height="280" rx="20" fill="url(#bg)"/>
<g fill="none" stroke="url(#line)" stroke-width="1.3" opacity=".65" class="wave">
<path d="M-40 216C130 165 225 285 430 230S695 158 900 212"/>
<path d="M-40 237C160 184 270 298 464 248S735 174 900 229" opacity=".45"/>
</g>
<path class="flow" d="M-40 216C130 165 225 285 430 230S695 158 900 212" fill="none" stroke="#087F79" stroke-width="2" opacity=".55"/>
<text class="label" x="427" y="51" text-anchor="middle">BACKEND JAVA</text>
<text class="name" x="427" y="126" text-anchor="middle">Vinícius Oliveira</text>
<text class="message first" x="427" y="184" text-anchor="middle">Java + Spring Boot</text>
<text class="message second" x="427" y="184" text-anchor="middle">APIs, segurança e testes</text>
<text class="message third" x="427" y="184" text-anchor="middle">Microsserviços em estudo</text>
</g>
<rect x=".5" y=".5" width="853" height="279" rx="20" fill="none" stroke="#D8E6ED"/>
</svg>
