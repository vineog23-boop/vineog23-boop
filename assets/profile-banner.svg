<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Vinícius Oliveira — Desenvolvimento Backend Java</title>
  <desc id="description">Capa pessoal em azul escuro, ciano e azul. Java, Spring Boot, APIs e testes.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101C2E"/><stop offset="1" stop-color="#0A101B"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#61DBCA"/><stop offset="1" stop-color="#6CA6FF"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#24354D"/></pattern>
    <clipPath id="boundary"><rect width="1200" height="340" rx="22"/></clipPath>
    <clipPath id="typing"><rect class="reveal" x="80" y="264" width="535" height="34"/></clipPath>
  </defs>
  <style>
    .reveal{animation:typing 10s steps(34,end) infinite}
    .cursor{animation:travel 10s steps(34,end) infinite,blink 1s step-end infinite}
    .signal{animation:pulse 4s ease-in-out infinite}
    @keyframes typing{0%,6%{width:0px}48%,90%{width:535px}100%{width:0px}}
    @keyframes travel{0%,6%{transform:translateX(0)}48%,90%{transform:translateX(535px)}100%{transform:translateX(0)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.reveal,.cursor,.signal{animation:none}.cursor{display:none}}
  </style>
  <g clip-path="url(#boundary)">
    <rect width="1200" height="340" fill="url(#surface)"/>
    <rect x="690" width="510" height="340" fill="url(#grid)" opacity=".6"/>
    <path d="M720 -25L955 340M850 -25L1085 340M980 -25L1215 340" stroke="#1D3049" stroke-width="1"/>
    <path d="M60 0H460" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <text x="60" y="65" fill="#64DCCA" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="4">DESENVOLVIMENTO BACKEND</text>
    <text x="57" y="151" fill="#F0F6FC" font-family="Arial,Helvetica,sans-serif" font-size="74" font-weight="700" letter-spacing="-2">Vinícius Oliveira</text>
    <text x="60" y="203" fill="#A8BAD1" font-family="Arial,Helvetica,sans-serif" font-size="24">Java · Spring Boot · Engenharia de Software</text>
    <rect x="60" y="248" width="610" height="59" rx="10" fill="#090F19" stroke="#273B53"/>
    <text x="80" y="286" fill="#65DCCA" font-family="monospace" font-size="22" clip-path="url(#typing)" textLength="522" lengthAdjust="spacingAndGlyphs">&gt; Java + Spring Boot | APIs + testes</text>
    <rect class="cursor" x="80" y="267" width="10" height="23" rx="1" fill="#65DCCA"/>
    <rect x="876" y="68" width="238" height="210" rx="24" fill="#111E30" stroke="#2A435F"/>
    <rect x="893" y="85" width="204" height="176" rx="16" fill="none" stroke="#29465A"/>
    <text x="995" y="193" fill="url(#accent)" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="88" font-weight="700" letter-spacing="-6">VO</text>
    <text x="995" y="234" fill="#91A5BF" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="4">JAVA / SPRING</text>
    <circle class="signal" cx="1104" cy="80" r="7" fill="#65DCCA"/>
    <path d="M835 128L814 149L835 170M1150 190L1171 211L1150 232" fill="none" stroke="#547DAB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 339H1200" stroke="url(#accent)" stroke-width="2" opacity=".6"/>
  </g>
</svg>
